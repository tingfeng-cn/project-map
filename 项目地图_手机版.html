function render(filter) {
    var filtered = filter ? DATA.filter(function(p){return p.s.indexOf(filter)===0}) : DATA;
    
    // 统计
    var stats = {};
    DATA.forEach(function(p){ 
        var k = p.s ? p.s.substring(0,2) : '其他'; 
        stats[k] = (stats[k]||0)+1; 
    });
    var statsHtml = '<div class="stat"><div class="stat-num">'+DATA.length+'</div><div class="stat-label">全部</div></div>';
    for(var k in stats) {
        statsHtml += '<div class="stat"><div class="stat-num">'+stats[k]+'</div><div class="stat-label">'+k+'</div></div>';
    }
    document.getElementById('stats').innerHTML = statsHtml;
    
    // 筛选按钮
    var filters = {'全部':''};
    DATA.forEach(function(p){ 
        var k = p.s ? p.s.substring(0,2) : 'O'; 
        filters[k] = k; 
    });
    var filterHtml = '';
    for(var k in filters) {
        var v = filters[k];
        var active = (filter==v)?' class="filter active"':' class="filter"';
        filterHtml += '<button'+active+' onclick="render(\''+v+'\')">'+k+'</button>';
    }
    document.getElementById('filters').innerHTML = filterHtml;
    
    // 列表
    var html = '';
    filtered.forEach(function(p) {
        var stageLabel = p.label || p.s || '未建联';
        html += '<div class="card" onclick="this.querySelector('.detail').classList.toggle('show')">';
        html += '<div><span class="card-dot" style="background:'+p.color+'"></span><span class="card-title">'+p.n+'</span></div>';
        html += '<div class="card-info"><span>📐 '+p.a+'万㎡</span><span>💰 '+p.f+'元</span><span>📍 '+p.d+'</span><span>📊 '+stageLabel+'</span></div>';
        html += '<div class="detail">';
        if(p.g) html += '👥 '+p.g+'<br>';
        if(p.p) html += '💬 '+p.p;
        html += '</div></div>';
    });
    document.getElementById('list').innerHTML = html;
}
